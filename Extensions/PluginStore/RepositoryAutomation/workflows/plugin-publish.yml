name: Plugin controlled publication
on:
  workflow_run:
    workflows: [Plugin label admission, Plugin source updates]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      check_only:
        description: Validate approved records without publishing
        required: true
        default: true
        type: boolean
permissions:
  contents: read
concurrency:
  group: index-metadata
  cancel-in-progress: false
jobs:
  verify:
    if: >-
      github.repository == 'HunYuan2333/Phinix-Plugin-Index' && github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && (startsWith(github.event.workflow_run.display_title, 'Label admission #') || github.event.workflow_run.display_title == 'Source update admission')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      pull-requests: read
      issues: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 10.0.x
      - run: dotnet build Validator/Validator.csproj --configuration Release
      - run: python3 -m unittest discover -s tests -v
      - env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publisher.py --validator Validator/bin/Release/net10.0/Validator.dll --check-only
  publish:
    if: github.event_name == 'workflow_run' || inputs.check_only == false
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
      pull-requests: read
      issues: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 10.0.x
      - run: dotnet build Validator/Validator.csproj --configuration Release
      - env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publisher.py --validator Validator/bin/Release/net10.0/Validator.dll
  notify:
    if: >-
      always() && github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.display_title, 'Label admission #') && github.repository == 'HunYuan2333/Phinix-Plugin-Index'
    needs: [verify, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
          PUBLISHED: ${{ needs.publish.result == 'success' }}
        run: python3 scripts/label_admission.py feedback --stage publication --success "$PUBLISHED"

  notify_updates:
    if: >-
      always() && github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.display_title == 'Source update admission' && github.repository == 'HunYuan2333/Phinix-Plugin-Index'
    needs: [verify, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      issues: write
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
          PUBLISHED: ${{ needs.publish.result == 'success' }}
        run: python3 scripts/source_updates.py feedback --success "$PUBLISHED"
