name: Plugin admission
run-name: 'Admit #${{ inputs.issue_number }} ${{ inputs.candidate_sha256 }}'
on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Submission issue number
        required: true
        type: string
      candidate_sha256:
        description: Exact canonical candidate SHA-256 from intake
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: index-metadata
  cancel-in-progress: false
jobs:
  validate:
    if: github.repository == 'HunYuan2333/Phinix-Plugin-Index' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 10.0.x
      - run: dotnet build Validator/Validator.csproj --configuration Release
      - run: python3 -m unittest discover -s tests -v
      - name: Approve exact candidate and prepare permanent evidence
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          CANDIDATE_SHA256: ${{ inputs.candidate_sha256 }}
        run: python3 scripts/admission.py prepare --issue-number "$ISSUE_NUMBER" --candidate-sha256 "$CANDIDATE_SHA256" --validator Validator/bin/Release/net10.0/Validator.dll --output approval
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: approval
          path: approval/
          retention-days: 14
          if-no-files-found: error
  propose:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      issues: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: approval
          path: approval
      - env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/admission.py pr --input approval
