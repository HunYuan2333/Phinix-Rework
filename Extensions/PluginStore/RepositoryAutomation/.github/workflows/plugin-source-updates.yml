name: Plugin source updates
run-name: Source update admission
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      check_only:
        description: Discover and validate without admitting versions
        required: true
        default: true
        type: boolean
permissions:
  contents: read
concurrency:
  group: index-metadata
  cancel-in-progress: false
jobs:
  validate:
    if: github.repository == 'HunYuan2333/Phinix-Plugin-Index' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      changed: ${{ steps.scan.outputs.changed }}
    permissions:
      contents: read
      pull-requests: read
      issues: read
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 10.0.x
      - run: dotnet build Validator/Validator.csproj --configuration Release
      - run: python3 -m unittest discover -s tests -v
      - id: scan
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_ONLY: ${{ inputs.check_only || false }}
        run: |
          if [ "$CHECK_ONLY" = "true" ]; then
            python3 scripts/source_updates.py scan --validator Validator/bin/Release/net10.0/Validator.dll --output updates --check-only
          else
            python3 scripts/source_updates.py scan --validator Validator/bin/Release/net10.0/Validator.dll --output updates
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-updates
          path: updates/
          retention-days: 14
          if-no-files-found: error
  propose:
    needs: validate
    if: needs.validate.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      issues: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: source-updates
          path: updates
      - env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/source_updates.py propose --input updates
  report:
    needs: [validate, propose]
    if: always() && needs.validate.result == 'success' && (github.event_name == 'schedule' || inputs.check_only == false)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: source-updates
          path: updates
      - env:
          GH_TOKEN: ${{ github.token }}
          ADMISSION_FAILED: ${{ needs.propose.result == 'failure' }}
        run: |
          if [ "$ADMISSION_FAILED" = "true" ]; then
            python3 scripts/source_updates.py report --input updates --admission-failed
          else
            python3 scripts/source_updates.py report --input updates
          fi
