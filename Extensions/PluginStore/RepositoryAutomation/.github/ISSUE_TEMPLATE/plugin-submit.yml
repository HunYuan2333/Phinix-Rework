name: Plugin submission / 插件申请
description: Submit a fixed managed DLL release for static checks and first-time review.
title: "[Plugin] "
body:
  - type: markdown
    attributes:
      value: |
        First-time publication needs maintainer review; a passing bot report is not approval.
        首次上架需要维护者审核，机器人检查通过不等于批准。
        Copy examples/managed-submission.json and replace ALL candidate fields with your release.
        参考 examples/managed-submission.json；首次版本仅接受公开源码与正式 GitHub Release 的托管 DLL 包。
        Do not submit tokens, private data, game DLLs or download scripts.
  - type: textarea
    id: candidate
    attributes:
      label: Candidate JSON
      description: Exact schemaVersion=1 envelope and schema-v3 package record; IDs are decimal strings.
      render: json
      placeholder: '{"schemaVersion":1,"package":{...}}'
    validations:
      required: true
  - type: textarea
    id: source_notes
    attributes:
      label: Source and distribution notes / 源码与分发说明
      description: Explain source layout, distribution permission/license and any game-test evidence. Do not add secrets.
    validations:
      required: true
