name: Full project build

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_VERSION: 10.0.401
  RIMWORLD_REF_VERSION: 1.6.4871

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Server and tests (Linux, .NET 10)
          - os: windows-latest
            name: Full build and tests (Windows, RimWorld 1.6)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Select SDK for the protobuf submodule
        run: |
          # The vendored global.json requests .NET 6. Keep it unchanged and use the installed SDK.
          "MSBuildSDKsPath=$env:DOTNET_ROOT/sdk/$env:DOTNET_VERSION/Sdks" >> $env:GITHUB_ENV
          dotnet --info

      - name: Install NuGet for legacy client dependencies
        if: runner.os == 'Windows'
        uses: NuGet/setup-nuget@12c57947e9458a5b976961b08ea0706a17dd71ae # v3
        with:
          nuget-version: 7.0.0

      - name: Install protocol compiler
        if: runner.os == 'Windows'
        run: |
          # Match the pinned protobuf submodule; Windows projects regenerate their .proto files.
          $archive = Join-Path $env:RUNNER_TEMP 'protoc.zip'
          $destination = Join-Path $env:RUNNER_TEMP 'protoc'
          Invoke-WebRequest 'https://github.com/protocolbuffers/protobuf/releases/download/v34.1/protoc-34.1-win64.zip' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne '6d7ebdc75e9c1f0026d4fb28f17ef1d0aae77d36744d83a9e052d79ba493724f') {
            throw 'Unexpected protoc archive checksum'
          }
          Expand-Archive $archive -DestinationPath $destination
          "$destination/bin" >> $env:GITHUB_PATH

      - name: Restore client dependencies and RimWorld reference assemblies
        if: runner.os == 'Windows'
        run: |
          foreach ($config in @('Client/Source/packages.config', 'Common/Utils/packages.config')) {
            nuget install $config -OutputDirectory .nuget -NonInteractive -Source https://api.nuget.org/v3/index.json
            if ($LASTEXITCODE -ne 0) { throw "NuGet install failed: $config" }
          }
          # This legacy HintPath is not listed in packages.config.
          nuget install System.Numerics.Vectors -Version 4.4.0 -OutputDirectory .nuget -NonInteractive -Source https://api.nuget.org/v3/index.json
          if ($LASTEXITCODE -ne 0) { throw 'Vector dependency restore failed' }
          nuget install Krafs.Rimworld.Ref -Version $env:RIMWORLD_REF_VERSION -OutputDirectory .nuget -NonInteractive -Source https://api.nuget.org/v3/index.json
          if ($LASTEXITCODE -ne 0) { throw 'RimWorld reference restore failed' }
          New-Item GameDlls/1.6 -ItemType Directory -Force | Out-Null
          Copy-Item ".nuget/Krafs.Rimworld.Ref.$env:RIMWORLD_REF_VERSION/ref/net472/*.dll" GameDlls/1.6

      - name: Build full solution for RimWorld 1.6
        if: runner.os == 'Windows'
        run: dotnet build Phinix.sln --configuration 'Release 1.6' --no-incremental

      - name: Build server
        if: runner.os == 'Linux'
        run: dotnet build Server/Server.csproj --configuration Release

      - name: Run server runtime regression tests
        run: dotnet run --project Tests/Phase35RuntimeTests/Phase35RuntimeTests.csproj --configuration Release

      - name: Run responsive UI geometry tests
        run: dotnet run --project Tests/ResponsiveUiGeometryTests/ResponsiveUiGeometryTests.csproj --configuration Release

      - name: Check build artifacts
        run: ./.github/scripts/check-artifacts.ps1 -IncludeClient:$IsWindows

      - name: Upload client
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: PhinixClient-1.6-${{ github.sha }}
          path: |
            Output/phinix-rework/
            !Output/phinix-rework/Source/
            !Output/phinix-rework/Abstractions/
          if-no-files-found: error
          retention-days: 14

      - name: Upload server
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: PhinixServer-${{ runner.os }}-${{ github.sha }}
          path: |
            Server/bin/Release/net10.0/
            !Server/bin/Release/net10.0/*.pdb
          if-no-files-found: error
          retention-days: 14
